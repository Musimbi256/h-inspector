<div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" data-a="fback">Back</button>${last?'<button class="btn" style="flex:2" data-a="fsub">Submit</button>':'<button class="btn" style="flex:2" data-a="fnext">Next</button>'}</div><div style="text-align:center;margin-top:10px"><button class="chip sm" data-a="fexit">Save draft &amp; exit</button></div>`}

function startForm(init){VAL={};MEDIA={};FU='';R.forEach(r=>{if(r[10]!=null&&r[1])VAL[r[1]]=/\(/.test(r[10])?ev(r[10]):(NT[r[1]]?+r[10]:r[10])});if(init)Object.assign(VAL,init);else{VAL.inspector_name=P.name;VAL.insp_date=TODAY()}FA=true;PG='intro';ERR=[];tab='new';render();scrollTo(0,0)}

function sigInit(){document.querySelectorAll('canvas[data-sig]').forEach(c=>{const n=c.dataset.sig,x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#000';if(VAL[n]){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=VAL[n]}let d=0;const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{d=1;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>{d=0;VAL[n]=c.toDataURL('image/png');draft()}})}

else if(t.dataset.img){if(t.files[0])shrink(t.files[0],u=>{MEDIA[t.dataset.img]=u;VAL[t.dataset.img]='photo';redo(true)});return}

const TOOLS={school:'🏫 School',hcf:'🏥 Health facility',public:'🏛️ Public institution',eating:'🍽️ Eating place',salon:'💈 Salon',lodging:'🏨 Lodging',water:'🚰 Water point',facility:'🏭 Other facility',drugshop:'🏪 Drug shop',pharmacy:'💊 Pharmacy',meat:'🥩 Meat / butchery',abattoir:'🐄 Abattoir',kpi:'📊 EH KPI report'};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='tab'){tab=v;render();scrollTo(0,0)}else if(a==='prof')prof();else if(a==='psave')psave();else if(a==='del')del(v);else if(a==='fud')upd(v,{fuDone:true});else if(a==='fuall'){fuAll=!fuAll;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.t)setT(t.dataset.t,t.dataset.n,t.value)});
render();
/* ===== Firebase (live mode) ===== */
function loginV(){return`<div class="card"><div class="b">Sign in to H Inspector</div><div class="s" style="margin:4px 0">Use the email and password given to you by your administrator.</div><label>Email</label><input id="l_e" type="email" autocomplete="username"><label>Password</label><input id="l_p" type="password" autocomplete="current-password">${authMsg?`<div class="s" style="color:var(--bad);margin-top:8px">${esc(authMsg)}</div>`:''}<button class="btn" data-a="login">Sign in</button></div>`}
function listen(){unsubs.forEach(f=>f());unsubs=[];db=FS;let q=FS.collection('inspections');if(!sup())q=q.where('uid','==',U.uid);
unsubs.push(q.onSnapshot(s=>{ins=s.docs.map(d=>({id:d.id,...d.data()}));if(tab!=='new')render()},e=>toast('Could not load records')));
unsubs.push(FS.collection('targets').onSnapshot(s=>{tgs={};s.docs.forEach(d=>tgs[d.id]=d.data());if(tab!=='new')render()},e=>{}));render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!LIVE)return;const a=b.dataset.a;
if(a==='login'){authMsg='';firebase.auth().signInWithEmailAndPassword($('#l_e').value.trim(),$('#l_p').value).catch(()=>{authMsg='Wrong email or password';render()})}
else if(a==='logout'){firebase.auth().signOut()}});
if(LIVE){firebase.initializeApp(FBC);FS=firebase.firestore();FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebase.auth().onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];U=u;db=null;P=null;ins=[];tgs={};authReady=true;
if(!u){tab='home';render();return}
try{const d=await FS.collection('users').doc(u.uid).get();if(d.exists){const x=d.data();P={name:x.name,fac:x.fac,role:x.role||'entrant'};listen()}else{tab='prof';render()}}catch(e){toast('Could not load your profile');render()}})}
</script></body></html>
